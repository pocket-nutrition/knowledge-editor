[package]
name = "pocket-nutrition-knowledge-editor"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# The crate ships a second binary (review-mcp, src/bin/review_mcp.rs), so
# `cargo run` (used by `tauri dev`) is ambiguous without this. Pin the app.
default-run = "pocket-nutrition-knowledge-editor"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pocket_nutrition_knowledge_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "review-mcp"
path = "src/bin/review_mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
jsonschema = { version = "0.49", default-features = false }
anyhow = "1"
thiserror = "2"
parking_lot = "0.13"
tempfile = "3"
notify = "8"
notify-debouncer-full = "0.7"
dirs = "7"
toml = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rstest = "0.28"

